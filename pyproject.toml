[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ontario-build-planning"
version = "0.1.0"
description = "Ontario public infrastructure portfolio intelligence and procurement radar"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["playwright>=1.62,<2", "pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["api*", "domain*", "services*"]
